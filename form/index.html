<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document Upload</title>
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    /* ── Tokens ── */
    :root {
      --brand: #1a56db;
      --brand-light: #e8f0fe;
      --surface: #ffffff;
      --bg: #f5f7fa;
      --text: #111827;
      --muted: #6b7280;
      --border: #d1d5db;
      --radius: 10px;
      --shadow: 0 2px 12px rgba(0,0,0,.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      max-width: 560px;
      width: 100%;
      padding: 40px 36px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }
    .logo-wrap img { height: 48px; border-radius: 6px; }
    .logo-wrap[hidden] { display: none !important; }
    .header-text h1 { font-size: 1.35rem; font-weight: 700; }
    .header-text p  { font-size: .875rem; color: var(--muted); margin-top: 2px; }

    /* ── Drop zone ── */
    .dropzone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .dropzone.over {
      border-color: var(--brand);
      background: var(--brand-light);
    }
    .dropzone svg { color: var(--muted); margin-bottom: 10px; }
    .dropzone p   { font-size: .9rem; color: var(--muted); }
    .dropzone strong { color: var(--brand); }
    #file-input { display: none; }

    /* ── File list ── */
    .file-list { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
    .file-row {
      background: var(--bg);
      border-radius: 6px;
      padding: 10px 12px;
      font-size: .85rem;
    }
    .file-row-top { display: flex; justify-content: space-between; align-items: center; }
    .file-name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 340px; }
    .file-size { color: var(--muted); flex-shrink: 0; margin-left: 8px; }
    .progress-bar {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-top: 6px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--brand);
      border-radius: 2px;
      width: 0%;
      transition: width .15s;
    }
    .file-status { font-size: .78rem; color: var(--muted); margin-top: 4px; }
    .file-status.ok   { color: #059669; }
    .file-status.err  { color: #dc2626; }

    /* ── Fields ── */
    .fields { margin-top: 20px; display: flex; flex-direction: column; gap: 12px; }
    label { font-size: .85rem; font-weight: 500; display: block; margin-bottom: 4px; }
    input, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 12px;
      font-size: .9rem;
      font-family: inherit;
      transition: border-color .2s;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(26,86,219,.12);
    }
    textarea { resize: vertical; min-height: 72px; }

    /* ── Submit ── */
    .btn-submit {
      margin-top: 24px;
      width: 100%;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 13px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, opacity .2s;
    }
    .btn-submit:hover { background: #1346b8; }
    .btn-submit:disabled { opacity: .55; cursor: not-allowed; }

    /* ── Success screen ── */
    .success-screen {
      text-align: center;
      padding: 20px 0;
    }
    .success-screen .check {
      width: 60px; height: 60px;
      background: #d1fae5;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      font-size: 28px;
    }
    .success-screen h2 { font-size: 1.3rem; margin-bottom: 8px; }
    .success-screen p  { color: var(--muted); font-size: .9rem; }

    /* ── Error banner ── */
    .error-banner {
      background: #fee2e2;
      color: #991b1b;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: .85rem;
      margin-top: 12px;
    }

    /* ── Not found ── */
    .not-found { text-align: center; color: var(--muted); padding: 20px 0; }
  </style>
</head>
<body>
<div class="card" id="app">

  <!-- Loading state -->
  <div id="loading-state">
    <p style="text-align:center;color:var(--muted);padding:20px 0;">Loading…</p>
  </div>

  <!-- Not found state -->
  <div id="not-found-state" hidden>
    <div class="not-found">
      <p style="font-size:2rem;">🔍</p>
      <h2 style="margin:12px 0 6px;">Page not found</h2>
      <p>Check the URL and try again.</p>
    </div>
  </div>

  <!-- Upload form -->
  <div id="upload-form" hidden>
    <div class="header">
      <div class="logo-wrap" id="client-logo-wrap" hidden>
        <img id="client-logo" src="" alt="Logo">
      </div>
      <div class="header-text">
        <h1 id="client-name">Document Upload</h1>
        <p>Securely send us your files</p>
      </div>
    </div>

    <!-- Drop zone -->
    <div class="dropzone" id="dropzone" role="button" tabindex="0"
         aria-label="Drop files here or click to select">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
      </svg>
      <p><strong>Click to select files</strong> or drag &amp; drop here</p>
      <p style="margin-top:4px;font-size:.8rem;">PDF, Word, images, spreadsheets — any format</p>
    </div>
    <input type="file" id="file-input" multiple>

    <div class="file-list" id="file-list"></div>

    <div class="fields">
      <div>
        <label for="f-name">Your name</label>
        <input type="text" id="f-name" placeholder="Jane Smith" autocomplete="name">
      </div>
      <div>
        <label for="f-email">Your email <span style="color:var(--muted);font-weight:400;">(optional)</span></label>
        <input type="email" id="f-email" placeholder="jane@example.com" autocomplete="email">
      </div>
      <div>
        <label for="f-note">Note <span style="color:var(--muted);font-weight:400;">(optional)</span></label>
        <textarea id="f-note" placeholder="Any context about these files…"></textarea>
      </div>
    </div>

    <div id="error-banner" class="error-banner" hidden></div>

    <button class="btn-submit" id="btn-submit" disabled>
      Upload files
    </button>
  </div>

  <!-- Success screen -->
  <div id="success-screen" class="success-screen" hidden>
    <div class="check">✓</div>
    <h2>Files received!</h2>
    <p>Thank you — we'll take it from here.</p>
  </div>

</div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js?v=1"></script>
<script>
// ── CONFIG — filled by build/deploy step ──────────────────────
const SUPABASE_URL  = "https://nkjuodujynwddnqfigtg.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ranVvZHVqeW53ZGRucWZpZ3RnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1ODk4MjksImV4cCI6MjA5NjE2NTgyOX0.RdKe1RLGmASdf3ip8_IH19pINuVjU6jkyZAWU41FqAU";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// ── State ─────────────────────────────────────────────────────
const params     = new URLSearchParams(location.search);
const clientSlug = params.get("client") || location.pathname.split("/").filter(Boolean)[0];
let   files      = [];   // { file, id, status }

// ── DOM refs ─────────────────────────────────────────────────
const $ = id => document.getElementById(id);

function show(id)  { $(id).hidden = false; }
function hide(id)  { $(id).hidden = true;  }

// ── Bootstrap ────────────────────────────────────────────────
(async () => {
  if (!clientSlug) { hide("loading-state"); show("not-found-state"); return; }

  const { data: branding } = await supabase.rpc("client_branding", { p_slug: clientSlug });

  hide("loading-state");

  if (!branding) { show("not-found-state"); return; }

  $("client-name").textContent = branding.name + " — Document Upload";
  document.title = branding.name + " — Document Upload";

  if (branding.logo_url) {
    $("client-logo").src = branding.logo_url;
    show("client-logo-wrap");
  }

  show("upload-form");
})();

// ── Dropzone ─────────────────────────────────────────────────
const dropzone  = $("dropzone");
const fileInput = $("file-input");

dropzone.addEventListener("click",   () => fileInput.click());
dropzone.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") fileInput.click(); });
dropzone.addEventListener("dragover",  e => { e.preventDefault(); dropzone.classList.add("over"); });
dropzone.addEventListener("dragleave", () => dropzone.classList.remove("over"));
dropzone.addEventListener("drop", e => {
  e.preventDefault();
  dropzone.classList.remove("over");
  addFiles([...e.dataTransfer.files]);
});
fileInput.addEventListener("change", () => addFiles([...fileInput.files]));

function addFiles(newFiles) {
  for (const f of newFiles) {
    files.push({ file: f, id: Math.random().toString(36).slice(2), status: "pending" });
  }
  renderFileList();
  $("btn-submit").disabled = files.length === 0;
}

function renderFileList() {
  const list = $("file-list");
  list.innerHTML = "";
  for (const entry of files) {
    const el = document.createElement("div");
    el.className = "file-row";
    el.id = "row-" + entry.id;
    el.innerHTML = `
      <div class="file-row-top">
        <span class="file-name">${escHtml(entry.file.name)}</span>
        <span class="file-size">${fmtSize(entry.file.size)}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="pf-${entry.id}"></div></div>
      <div class="file-status" id="fs-${entry.id}"></div>
    `;
    list.appendChild(el);
  }
}

// ── Upload ────────────────────────────────────────────────────
$("btn-submit").addEventListener("click", upload);

async function upload() {
  const name  = $("f-name").value.trim();
  const email = $("f-email").value.trim();
  const note  = $("f-note").value.trim();

  if (files.length === 0) return;
  if (!name) { showError("Please enter your name."); return; }

  hide("error-banner");
  $("btn-submit").disabled = true;
  $("btn-submit").textContent = "Uploading…";

  let allOk = true;

  for (const entry of files) {
    const { file } = entry;
    const safeName = sanitizeKey(file.name);
    const path     = `${clientSlug}/${Date.now()}-${safeName}`;

    // Storage upload
    const { error: upErr } = await supabase.storage
      .from("client-docs")
      .upload(path, file, {
        contentType: file.type || "application/octet-stream",
        onUploadProgress: p => {
          const pct = Math.round((p.loaded / p.total) * 100);
          setProgress(entry.id, pct);
        },
      });

    if (upErr) {
      setStatus(entry.id, "Upload failed: " + upErr.message, "err");
      allOk = false;
      continue;
    }

    // DB row — INSERT only, no .select() needed under insert-only RLS
    const { error: dbErr } = await supabase
      .from("submissions")
      .insert({
        client_slug:       clientSlug,
        uploader_name:     name || null,
        uploader_email:    email || null,
        note:              note || null,
        file_path:         path,
        original_filename: file.name,
        file_size:         file.size,
        content_type:      file.type || null,
        source:            "form",
      });

    if (dbErr) {
      setStatus(entry.id, "Logged failed: " + dbErr.message, "err");
      allOk = false;
    } else {
      setProgress(entry.id, 100);
      setStatus(entry.id, "✓ Uploaded", "ok");
    }
  }

  if (allOk) {
    setTimeout(() => {
      hide("upload-form");
      show("success-screen");
    }, 600);
  } else {
    $("btn-submit").disabled  = false;
    $("btn-submit").textContent = "Retry failed files";
    showError("Some files failed. Check each file above.");
  }
}

// ── Helpers ───────────────────────────────────────────────────
function setProgress(id, pct) {
  const el = document.getElementById("pf-" + id);
  if (el) el.style.width = pct + "%";
}
function setStatus(id, msg, cls = "") {
  const el = document.getElementById("fs-" + id);
  if (!el) return;
  el.textContent  = msg;
  el.className    = "file-status " + cls;
}
function showError(msg) {
  const el = $("error-banner");
  el.textContent = msg;
  el.hidden = false;
}
function fmtSize(bytes) {
  if (bytes < 1024)       return bytes + " B";
  if (bytes < 1048576)    return (bytes/1024).toFixed(1) + " KB";
  return (bytes/1048576).toFixed(1) + " MB";
}
function sanitizeKey(name) {
  // Keep only safe chars for storage object keys
  return name
    .replace(/[^A-Za-z0-9._\-]/g, "_")
    .replace(/_+/g, "_")
    .slice(0, 200);
}
function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
</script>
</body>
</html>
